name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history: tests/test_r30_crossfamily_ail4.py checks the pre-registration chain from git
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install pytest==9.1.1 ruff==0.15.20 .
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Tests
        run: python -m pytest -q
      - name: Pre-registration chain (git history)
        # every registered chain (R29, R33, R34); fails closed on a squashed or rewritten history
        run: python scripts/verify_preregistration.py --chain all > "$RUNNER_TEMP/prereg.json" || { cat "$RUNNER_TEMP/prereg.json"; exit 1; }
      - name: CLI smoke test (installed package)
        run: |
          cd "$RUNNER_TEMP"
          python -m atomic_information_lab solve --horizon 2
          if python -m atomic_information_lab solve --horizon 9; then exit 1; fi

  mutation-probe:
    # Own job since R33: 45 mutants (each re-running the suites it names) outgrew the 20-minute limit of
    # the test matrix, which cancelled the job (run 44973398920). Same pinned actions, read-only token.
    name: mutation probe (ubuntu-latest, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the R30 suite, which some mutants run, checks the pre-registration chain from git history
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install pytest==9.1.1 .
      - name: Mutation probe
        run: python scripts/mutation_probe.py
